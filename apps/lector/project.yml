name: Lector
options:
  bundleIdPrefix: com.horacioeps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: WMY552P2HR
    CODE_SIGN_STYLE: Automatic
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    from: "3.11.1"
targets:
  Lector:
    type: application
    platform: iOS
    sources:
      - path: Lector
        excludes:
          - Resources/Info.plist
          - Secrets.Local.swift
      - path: Lector/Secrets.Local.swift
        optional: true
    resources:
      - path: Lector/Resources/Assets.xcassets
      - path: Lector/Resources/seed_book.md
    settings:
      base:
        PRODUCT_NAME: Lector
        PRODUCT_BUNDLE_IDENTIFIER: com.horacioeps.lector
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Lector/Resources/Info.plist
    info:
      path: Lector/Resources/Info.plist
      properties:
        CFBundleDisplayName: Capas
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTImportedTypeDeclarations: []
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
