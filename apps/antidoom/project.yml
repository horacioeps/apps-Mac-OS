name: AntiDoom
options:
  bundleIdPrefix: com.horacioeps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.horacioeps.antidoom
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: AntiDoom/Resources/Info.plist
targets:
  AntiDoom:
    type: application
    platform: iOS
    sources:
      - path: AntiDoom
        excludes:
          - Resources/Info.plist
    resources:
      - path: AntiDoom/Resources/seed_tweets.json
      - path: AntiDoom/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: AntiDoom
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: AntiDoom/Resources/Info.plist
      properties:
        CFBundleDisplayName: AntiDoom
        UILaunchScreen: {}
